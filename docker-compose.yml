services:
  llm-router:
    build: .
    env_file:
      - .env
    container_name: ${AUTO_ROUTER_CONTAINER_NAME:-auto-router}
    ports:
      - "${AUTO_ROUTER_BIND:-0.0.0.0}:${AUTO_ROUTER_HOST_PORT:-8088}:8088"
    environment:
      AUTO_ROUTER_HOST: 0.0.0.0
      AUTO_ROUTER_PORT: 8088
      AUTO_ROUTER_PROVIDER_CONFIG: /app/config/providers.yaml
      AUTO_ROUTER_POLICY_CONFIG: /app/config/policies.yaml
      AUTO_ROUTER_AGENT_CONFIG: /app/config/agent_workers.yaml
      AUTO_ROUTER_CONTEXT_CONFIG: ${AUTO_ROUTER_CONTEXT_CONFIG:-http://host.docker.internal:8000/api/router/context-projection}
      AUTO_ROUTER_REDIS_URL: redis://redis:6379/0
      AUTO_ROUTER_DATABASE_URL: sqlite:////data/router.sqlite3
      AUTO_ROUTER_REQUEST_TIMEOUT_SECONDS: ${AUTO_ROUTER_REQUEST_TIMEOUT_SECONDS:-120}
      AUTO_ROUTER_ATTEMPT_TIMEOUT_SECONDS: ${AUTO_ROUTER_ATTEMPT_TIMEOUT_SECONDS:-45}
      AUTO_ROUTER_CONNECT_TIMEOUT_SECONDS: ${AUTO_ROUTER_CONNECT_TIMEOUT_SECONDS:-5}
      AUTO_ROUTER_REQUEST_DEADLINE_SECONDS: ${AUTO_ROUTER_REQUEST_DEADLINE_SECONDS:-90}
      AUTO_ROUTER_MAX_CANDIDATE_ATTEMPTS: ${AUTO_ROUTER_MAX_CANDIDATE_ATTEMPTS:-4}
      AUTO_ROUTER_LIVE_MODEL_CACHE_TTL_SECONDS: ${AUTO_ROUTER_LIVE_MODEL_CACHE_TTL_SECONDS:-3600}
      AUTO_ROUTER_ASSISTX_EVENT_SINK_URL: ${AUTO_ROUTER_ASSISTX_EVENT_SINK_URL:-http://assistx-api:8000/api/events}
      AUTO_ROUTER_ASSISTX_EVENT_DISPATCH_TIMEOUT_SECONDS: ${AUTO_ROUTER_ASSISTX_EVENT_DISPATCH_TIMEOUT_SECONDS:-10}
      AUTO_ROUTER_ASSISTX_EVENT_DISPATCH_MAX_ATTEMPTS: ${AUTO_ROUTER_ASSISTX_EVENT_DISPATCH_MAX_ATTEMPTS:-5}
      AUTO_ROUTER_ASSISTX_BASIC_AUTH_USER: ${AUTO_ROUTER_ASSISTX_BASIC_AUTH_USER:-admin}
      AUTO_ROUTER_ASSISTX_BASIC_AUTH_PASS: ${AUTO_ROUTER_ASSISTX_BASIC_AUTH_PASS:-change-me}
      AUTO_ROUTER_ASSISTX_TASKS_URL: ${AUTO_ROUTER_ASSISTX_TASKS_URL:-http://assistx-api:8000/api/router/backlog-candidates}
      AUTO_ROUTER_ASSISTX_TASKS_TIMEOUT_SECONDS: ${AUTO_ROUTER_ASSISTX_TASKS_TIMEOUT_SECONDS:-10}
      AUTO_ROUTER_EXECUTOR_CLAIM_STATUS_URL: ${AUTO_ROUTER_EXECUTOR_CLAIM_STATUS_URL:-http://assistx-api:8000}
      AUTO_ROUTER_ASSISTX_EXECUTOR_SERVICE_TOKEN: ${AUTO_ROUTER_ASSISTX_EXECUTOR_SERVICE_TOKEN}

      AUTO_ROUTER_INTERNAL_SERVICE_TOKEN: ${AUTO_ROUTER_INTERNAL_SERVICE_TOKEN:?set AssistX-only router inference token}
      AUTO_ROUTER_EXECUTOR_AUTH_REQUIRED: "true"
      AUTO_ROUTER_EXECUTOR_VERIFY_KEY_FILE: /run/secrets/assistx_executor_public_key.pem
      AUTO_ROUTER_EXECUTOR_KEY_ID: assistx-executor-v1
      AUTO_ROUTER_RUNTIME_PROJECTION_URL: ${AUTO_ROUTER_RUNTIME_PROJECTION_URL:-http://host.docker.internal:8000/api/router/runtime-projection}
      AUTO_ROUTER_RUNTIME_PROJECTION_VERIFY_KEY_FILE: /run/secrets/assistx_runtime_projection_public_key.pem
      AUTO_ROUTER_RUNTIME_PROJECTION_KEY_ID: ${AUTO_ROUTER_RUNTIME_PROJECTION_KEY_ID:-assistx-runtime-projection-v1}
      AUTO_ROUTER_STRICT_OFFLINE: "true"
      AUTO_ROUTER_AUTOLOAD_ENABLED: "false"
      AUTO_ROUTER_PLACEMENT_UNLOAD: "false"
      AUTO_ROUTER_FLEET_DISPATCHER_ENABLED: "true"
      AUTO_ROUTER_AGENTGATEWAY_ENABLED: "false"
      AUTO_ROUTER_GATEWAY_MODE: direct
      AUTO_ROUTER_LOG_PROMPTS: "false"

    volumes:
      - ./config:/app/config:ro
      - ./data:/data
      - ./artifacts:/artifacts
      - /media/scott/SSD_4TB/hermes-home/home_scott_.config/assistx-fleet/assistx-runtime-projection-ed25519-public.pem:/run/secrets/assistx_runtime_projection_public_key.pem:ro
      - /media/scott/SSD_4TB/hermes-home/home_scott_.config/assistx-fleet/assistx-runtime-projection-ed25519-public.pem:/run/secrets/assistx_executor_public_key.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      default: {}
      assistx:
        aliases:
          - router

  redis:
    image: redis:7-alpine
    container_name: ${AUTO_ROUTER_REDIS_CONTAINER_NAME:-auto-router-redis}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  assistx:
    external: true
    name: ${AUTO_ROUTER_ASSISTX_NETWORK:-home_scott_git_auto-assist_default}

volumes:
  redis-data:
