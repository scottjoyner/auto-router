services:
  llm-router:
    build: .
    container_name: auto-router
    ports:
      - "8088:8088"
    environment:
      AUTO_ROUTER_HOST: 0.0.0.0
      AUTO_ROUTER_PORT: 8088
      AUTO_ROUTER_PROVIDER_CONFIG: /app/config/providers.yaml
      AUTO_ROUTER_POLICY_CONFIG: /app/config/policies.yaml
      AUTO_ROUTER_AGENT_CONFIG: /app/config/agent_workers.yaml
      AUTO_ROUTER_CONTEXT_CONFIG: ${AUTO_ROUTER_CONTEXT_CONFIG:-http://assistx:8000/api/router/context-projection}
      AUTO_ROUTER_REDIS_URL: redis://redis:6379/0
      AUTO_ROUTER_DATABASE_URL: sqlite:////data/router.sqlite3
      AUTO_ROUTER_REQUEST_TIMEOUT_SECONDS: ${AUTO_ROUTER_REQUEST_TIMEOUT_SECONDS:-120}
      AUTO_ROUTER_LIVE_MODEL_CACHE_TTL_SECONDS: ${AUTO_ROUTER_LIVE_MODEL_CACHE_TTL_SECONDS:-3600}
      AUTO_ROUTER_ASSISTX_EVENT_SINK_URL: ${AUTO_ROUTER_ASSISTX_EVENT_SINK_URL:-}
      AUTO_ROUTER_ASSISTX_EVENT_DISPATCH_TIMEOUT_SECONDS: ${AUTO_ROUTER_ASSISTX_EVENT_DISPATCH_TIMEOUT_SECONDS:-10}
      AUTO_ROUTER_ASSISTX_EVENT_DISPATCH_MAX_ATTEMPTS: ${AUTO_ROUTER_ASSISTX_EVENT_DISPATCH_MAX_ATTEMPTS:-5}
      AUTO_ROUTER_ASSISTX_BASIC_AUTH_USER: ${AUTO_ROUTER_ASSISTX_BASIC_AUTH_USER:-admin}
      AUTO_ROUTER_ASSISTX_BASIC_AUTH_PASS: ${AUTO_ROUTER_ASSISTX_BASIC_AUTH_PASS:-change-me}
      AUTO_ROUTER_ASSISTX_TASKS_URL: ${AUTO_ROUTER_ASSISTX_TASKS_URL:-}
      AUTO_ROUTER_ASSISTX_TASKS_TIMEOUT_SECONDS: ${AUTO_ROUTER_ASSISTX_TASKS_TIMEOUT_SECONDS:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # --- Agentgateway sidecar integration ---
      AUTO_ROUTER_AGENTGATEWAY_ENABLED: ${AUTO_ROUTER_AGENTGATEWAY_ENABLED:-false}
      AUTO_ROUTER_GATEWAY_MODE: ${AUTO_ROUTER_GATEWAY_MODE:-direct}
      AUTO_ROUTER_AGENTGATEWAY_BASE_URL: ${AUTO_ROUTER_AGENTGATEWAY_BASE_URL:-http://agentgateway:3000}
      AUTO_ROUTER_AGENTGATEWAY_OPENAI_BASE_URL: ${AUTO_ROUTER_AGENTGATEWAY_OPENAI_BASE_URL:-http://agentgateway:3000/v1}
      AUTO_ROUTER_AGENTGATEWAY_TIMEOUT_SECONDS: ${AUTO_ROUTER_AGENTGATEWAY_TIMEOUT_SECONDS:-120}
      AUTO_ROUTER_AGENTGATEWAY_FAIL_OPEN_TO_DIRECT: ${AUTO_ROUTER_AGENTGATEWAY_FAIL_OPEN_TO_DIRECT:-true}
      AUTO_ROUTER_AGENTGATEWAY_FAIL_CLOSED_FOR_PRIVATE: ${AUTO_ROUTER_AGENTGATEWAY_FAIL_CLOSED_FOR_PRIVATE:-true}
      AUTO_ROUTER_AGENTGATEWAY_EMIT_HEADERS: ${AUTO_ROUTER_AGENTGATEWAY_EMIT_HEADERS:-true}
      AUTO_ROUTER_AGENTGATEWAY_PASS_METADATA_IN_BODY: ${AUTO_ROUTER_AGENTGATEWAY_PASS_METADATA_IN_BODY:-true}
      AUTO_ROUTER_AGENTGATEWAY_RECONCILE_USAGE: ${AUTO_ROUTER_AGENTGATEWAY_RECONCILE_USAGE:-true}
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
      - ./artifacts:/artifacts
      - ./worktrees:/worktrees
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - assistx

  redis:
    image: redis:7-alpine
    container_name: auto-router-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  assistx:
    external: true
    name: auto-assist_default

volumes:
  redis-data:
