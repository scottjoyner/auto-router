[project]
name = "auto-router"
version = "0.1.0"
description = "Local-first OpenAI-compatible LLM router with free quota scheduling and LM Studio fallback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "redis>=5.0.0",
  "jinja2>=3.1.6",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-httpx>=0.30.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.5.0",
]

[project.scripts]
auto-router = "auto_router.main_live:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["tests/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
