# Integration smoke overlay for CI (LLD §3.5 W-66).
#
# Stands up just enough to verify the router boots, the background outbox
# dispatcher runs, and /health responds -- without requiring the full AssistX
# control plane. The router reads a local static context projection
# (config/context.example.yaml) and falls back to a bootstrap snapshot, so no
# external service is needed. Redis is included to exercise the quota/redis path.
services:
  llm-router:
    build: .
    container_name: auto-router-smoke
    ports:
      - "8088:8088"
    environment:
      AUTO_ROUTER_HOST: 0.0.0.0
      AUTO_ROUTER_PORT: 8088
      AUTO_ROUTER_CONTEXT_CONFIG: /app/config/context.example.yaml
      AUTO_ROUTER_REDIS_URL: redis://redis:6379/0
      AUTO_ROUTER_DATABASE_URL: sqlite:////data/router.sqlite3
      AUTO_ROUTER_ASSISTX_EVENT_SINK_URL: ""
      AUTO_ROUTER_FLEET_DISPATCHER_ENABLED: "false"
      AUTO_ROUTER_AGENTGATEWAY_ENABLED: "false"
      AUTO_ROUTER_GATEWAY_MODE: direct
      AUTO_ROUTER_OTEL_ENABLED: "false"
      AUTO_ROUTER_ADMIN_TOKEN: "smoke-admin-token"
      HERMES_HOME: /root/.hermes
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: auto-router-smoke-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: "no"

networks:
  default:
    name: auto-router-smoke
