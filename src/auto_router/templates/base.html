<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auto-router | {{ title }}</title>
    <script src="/static/vendor/tailwind.min.js"></script>
    <script src="/static/vendor/htmx.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        router: {
                            bg: '#07111f',
                            panel: '#0f1b2d',
                            panel2: '#111f35',
                            line: '#223653',
                            text: '#e7eefc',
                            muted: '#93a4bd',
                            cyan: '#35d6ff',
                            amber: '#f6c453',
                            green: '#4ade80',
                            red: '#fb7185'
                        }
                    },
                    boxShadow: {
                        glow: '0 0 40px rgba(53, 214, 255, 0.12)'
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-router-bg text-router-text font-sans antialiased">
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
        <div class="absolute -top-40 left-1/4 h-96 w-96 rounded-full bg-cyan-500/10 blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 h-96 w-96 rounded-full bg-amber-500/10 blur-3xl"></div>
    </div>

    <nav class="sticky top-0 z-40 border-b border-router-line/80 bg-router-bg/80 backdrop-blur-xl">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
            <a href="/dashboard" class="flex items-center gap-3">
                <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-cyan-400/15 text-cyan-300 ring-1 ring-cyan-300/30">↯</span>
                <span>
                    <span class="block text-lg font-bold tracking-tight">auto-router</span>
                    <span class="block text-xs text-router-muted">quota-aware model operations</span>
                </span>
            </a>
            <div class="hidden max-w-4xl items-center gap-2 overflow-x-auto text-xs text-router-muted md:flex">
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/dashboard">dashboard</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/health">health</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/metrics">metrics</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/admin/quota">quota</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/admin/context">context</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/admin/live-models">live models</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/admin/services">services</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/admin/outbox">outbox</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/admin/agent-clis">CLIs</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/admin/providers">providers</a>
                <a class="whitespace-nowrap rounded-full border border-router-line px-3 py-1.5 hover:border-cyan-300/60 hover:text-cyan-200" href="/api/dashboard/ops-summary">ops</a>
            </div>
        </div>
    </nav>

    <main class="relative z-10 mx-auto max-w-7xl px-5 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
