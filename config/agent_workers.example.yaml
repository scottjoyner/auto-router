agent_workers:
  - name: hermes
    type: hermes
    command: hermes
    enabled: true
    priority: 10
    launcher: hermes_oneshot
    model: ornith-1.0-35b
    provider: lmstudio
    env:
      LM_BASE_URL: http://host.docker.internal:1234/v1
    toolsets: [terminal, file, web, browser, code_execution, skills, session_search, memory, todo]
    quota:
      dimension: jobs_d
      mode: manual_daily
    policy:
      allowed_priorities: [repo_critical, critical, batch, background]
      allow_write_default: false
      allow_commit_default: false

  - name: hermes-mini
    type: hermes
    command: hermes
    enabled: true
    priority: 20
    launcher: hermes_oneshot
    model: vibethinker-3b-hermes
