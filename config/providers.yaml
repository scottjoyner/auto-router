providers:
- api_key_env: GROQ_API_KEY
  base_url: https://api.groq.com/openai/v1
  enabled: true
  headers: {}
  models:
  - alias: groq/fast-small
    capabilities:
    - chat
    - streaming
    - json
    - low_latency
    context_window: 8192
    provider_model: llama-3.1-8b-instant
    quota:
      rpm: 5
      tpd: 500000
  name: groq
  priority: 20
  quota_class: fast_free
  type: openai_compatible
- api_key_env: CEREBRAS_API_KEY
  base_url: https://api.cerebras.ai/v1
  enabled: true
  headers: {}
  metadata:
    docs: https://inference-docs.cerebras.ai
    notes: Public docs currently list gpt-oss-120b and preview zai-glm-4.7 on shared
      endpoints. Confirm live availability with GET /v1/models.
    role: flash_start_planning_node
  models:
  - alias: cerebras/flash-reasoner
    capabilities:
    - chat
    - streaming
    - json
    - code
    - reasoning
    - low_latency
    - flash_planning
    provider_model: gpt-oss-120b
    quota:
      rpm: 5
      tpd: 1000000
      tph: 1000000
      tpm: 30000
  - alias: cerebras/glm-4.7-preview
    capabilities:
    - chat
    - streaming
    - json
    - code
    - reasoning
    - tool_use
    - low_latency
    - flash_planning
    - preview
    provider_model: zai-glm-4.7
    quota:
      rpm: 5
      tpd: 1000000
      tph: 1000000
      tpm: 30000
  name: cerebras
  priority: 10
  quota_class: fast_free
  type: openai_compatible
- api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  enabled: true
  headers:
    HTTP-Referer: http://localhost:8088
    X-Title: auto-router
  models:
  - alias: openrouter/free-general
    capabilities:
    - chat
    - streaming
    context_window: 8192
    provider_model: meta-llama/llama-3.1-8b-instruct:free
    quota:
      rpd: 50
      rpm: 20
  name: openrouter
  priority: 80
  quota_class: brokered_free
  type: openai_compatible
