# Strict offline fleet provider registry.
#
# Public inference providers are intentionally absent. This file must contain only
# physical LAN/Tailscale/loopback runtimes. Discovery may update observations, but
# it must not add public providers or autonomously load models.
providers:
  - name: lmstudio-xwing
    type: lmstudio
    node_id: xwing
    enabled: true
    base_url: ${LMSTUDIO_XWING_BASE_URL:-http://xwing.tailcb8954.ts.net:1234/v1}
    priority: 90
    quota_class: local
    models:
      - alias: local/ornith-1.0-9b
        provider_model: ornith-1.0-9b
        capabilities: [chat, streaming, code, json, local_only, hermes_worker]
        context_window: 32768

  - name: lmstudio-joyner
    type: lmstudio
    node_id: joyner
    enabled: false
    base_url: ${LMSTUDIO_JOYNER_BASE_URL:-http://joyner.tailcb8954.ts.net:1234/v1}
    priority: 5
    quota_class: local
    models: []

  - name: lmstudio-deathstar
    type: lmstudio
    node_id: deathstar-XPS-8920
    enabled: true
    base_url: ${LMSTUDIO_DEATHSTAR_BASE_URL:-http://100.78.106.121:1234/v1}
    priority: 145
    quota_class: local
    models:
      - alias: local/deathstar-0.8b
        provider_model: qwen3.5-0.8b-claude-4.6-opus-reasoning-distilled
        capabilities: [chat, streaming, json, low_latency, local_only, quick_iteration, reasoning, hermes_worker]
        context_window: 262144
      - alias: local/deathstar-toolcall
        provider_model: refinedtoolcallv5-3b
        capabilities: [chat, streaming, code, json, local_only, hermes_worker, tool_use]
        context_window: 131072

  - name: lmstudio-x1-370
    type: lmstudio
    node_id: x1-370
    enabled: true
    base_url: ${LMSTUDIO_X1_BASE_URL:-http://host.docker.internal:1234/v1}
    priority: 100
    quota_class: local
    models:
      - alias: local/reasoning-large
        provider_model: ornith-1.0-35b
        capabilities: [chat, reasoning, json, local_only, large_context, hermes_worker]
        context_window: 131072
      - alias: local/tool-call-x1
        provider_model: refinedtoolcallv5-3b
        capabilities: [chat, streaming, code, json, local_only, hermes_worker, tool_use]
        context_window: 131072
      - alias: local/moe-fast
        provider_model: qwen3.5-9b-neo-heretic-i1
        capabilities: [chat, json, low_latency, local_only]
        context_window: 32768

  # Quarantined until one-slot admission control and a sustained concurrency canary pass.
  - name: lmstudio-beelink-ryzen-7-mini-pc
    type: lmstudio
    node_id: beelink-ryzen-7-mini-pc
    enabled: false
    base_url: ${LMSTUDIO_BEELINK_BASE_URL:-http://100.85.72.121:1234/v1}
    priority: 140
    quota_class: local
    models:
      - alias: local/worker-default
        provider_model: vibethinker-3b-hermes
        capabilities: [chat, streaming, code, json, local_only, hermes_worker]
        context_window: 131072

  # Disabled: documented CPU fallback is too slow for useful fleet routing.
  - name: lmstudio-lenovo-ideapad-330s-15ikb
    type: lmstudio
    node_id: scott-lenovo-ideapad-330s-15ikb
    enabled: false
    base_url: ${LMSTUDIO_LENOVO_BASE_URL:-http://scott-lenovo-ideapad-330s-15ikb.tailcb8954.ts.net:1234/v1}
    priority: 160
    quota_class: local
    models:
      - alias: local/lenovo-fast
        provider_model: liquid/lfm2.5-1.2b
        capabilities: [chat, streaming, json, low_latency, local_only, quick_iteration]
        context_window: 32768

  # Disabled until the node is online and passes a real completion canary.
  - name: lmstudio-optiplex-9030-aio
    type: lmstudio
    node_id: scott-optiplex-9030-aio
