# Strict offline fleet provider registry.
#
# Public inference providers are intentionally absent. This file must contain only
# physical LAN/Tailscale/loopback runtimes. Discovery may update observations, but
# it must not add public providers or autonomously load models.
providers:
  - name: lmstudio-xwing
    type: lmstudio
    node_id: xwing
    enabled: true
    base_url: ${LMSTUDIO_XWING_BASE_URL:-http://xwing.tailcb8954.ts.net:1234/v1}
    priority: 90
    quota_class: local
    models:
      - alias: local/ornith-1.0-9b
        provider_model: ornith-1.0-9b
        capabilities: [chat, streaming, code, json, local_only, hermes_worker]
        context_window: 32768

  - name: lmstudio-joyner
    type: lmstudio
    node_id: joyner
    enabled: false
    base_url: ${LMSTUDIO_JOYNER_BASE_URL:-http://joyner.tailcb8954.ts.net:1234/v1}
    priority: 5
    quota_class: local
    models: []

  - name: lmstudio-deathstar
    type: lmstudio
    node_id: deathstar-XPS-8920
    enabled: true
    base_url: ${LMSTUDIO_DEATHSTAR_BASE_URL:-http://100.78.106.121:1234/v1}
    # Deathstar's RX 480 is actively used by auto-ingest diarization.
    # Keep this endpoint available as a constrained fallback.
    priority: 220
    quota_class: local
    models:
      - alias: local/deathstar-0.8b
        provider_model: qwen3.5-0.8b-claude-4.6-opus-reasoning-distilled
        capabilities: [chat, streaming, json, low_latency, local_only, quick_iteration, reasoning, hermes_worker]
        context_window: 262144

  - name: lmstudio-x1-370
    type: lmstudio
    node_id: x1-370
    enabled: true
    base_url: ${LMSTUDIO_X1_BASE_URL:-http://host.docker.internal:1234/v1}
    priority: 100
    quota_class: local
    models:
      - alias: local/reasoning-large
        provider_model: ornith-1.0-35b
        capabilities: [chat, reasoning, json, local_only, large_context, hermes_worker]
        context_window: 131072
      - alias: local/tool-call-x1
        provider_model: refinedtoolcallv5-3b
        capabilities: [chat, streaming, code, json, local_only, hermes_worker, tool_use]
        context_window: 131072
      - alias: local/moe-fast
        provider_model: qwen3.5-9b-neo-heretic-i1
        capabilities: [chat, json, low_latency, local_only]
        context_window: 32768

  # Bounded live trial: four active prompts, no waiting queue. Additional
  # requests must be rejected/fallback instead of accumulating on Beelink.
  - name: lmstudio-beelink-ryzen-7-mini-pc
    type: lmstudio
    node_id: beelink-ryzen-7-mini-pc
    runtime_instance_id: beelink-ryzen-7-mini-pc-lfm2.5-1.2b
    enabled: true
    base_url: ${LMSTUDIO_BEELINK_BASE_URL:-http://100.85.72.121:1234/v1}
    priority: 240
    quota_class: local
    parallel_slots: 4
    queue_limit: 0
    queue_timeout_seconds: 0
    models:
      - alias: local/beelink-lfm-fast
        provider_model: liquid/lfm2.5-1.2b
        capabilities: [chat, streaming, json, local_only, quick_iteration, classification, compression, memory_constrained, low_concurrency]
        context_window: 32768
        max_concurrency: 4
        recommended_use: [compression, classification, extraction, quick_iteration]

  # Live-verified 2026-08-17: low-priority quick-iteration worker.
  - name: lmstudio-lenovo-ideapad-330s-15ikb
    type: lmstudio
    node_id: scott-lenovo-ideapad-330s-15ikb
    enabled: true
    base_url: ${LMSTUDIO_LENOVO_BASE_URL:-http://scott-lenovo-ideapad-330s-15ikb.tailcb8954.ts.net:1234/v1}
    priority: 160
    quota_class: local
    models:
      - alias: local/lenovo-fast
        provider_model: headless
        capabilities: [chat, streaming, json, low_latency, local_only, quick_iteration]
        context_window: 32768

  # Live-verified 2026-08-17: small quick-iteration worker. The previously
  # configured liquid/lfm2.5-1.2b timed out and remains intentionally unused.
  - name: lmstudio-optiplex-9030-aio
    type: lmstudio
    node_id: scott-optiplex-9030-aio
    runtime_instance_id: scott-optiplex-9030-aio-qwen035-08b
    enabled: true
    base_url: ${LMSTUDIO_OPTIPLEX_BASE_URL:-http://scott-optiplex-9030-aio.tailcb8954.ts.net:1234/v1}
    priority: 155
    quota_class: local
    parallel_slots: 1
    queue_limit: 0
    queue_timeout_seconds: 0
    models:
      - alias: local/optiplex-fast
        provider_model: qwen3.5-0.8b-claude-4.6-opus-reasoning-distilled
        capabilities: [chat, streaming, json, low_latency, local_only, quick_iteration, memory_constrained, low_concurrency]
        context_window: 32768
        max_concurrency: 1
        recommended_use: [compression, classification, extraction, quick_iteration]

  - name: lmstudio-scotts-macbook-air
    type: lmstudio
    node_id: scotts-macbook-air
    runtime_instance_id: scotts-macbook-air-qwen3.5-0.8b-mlx
    enabled: true
    base_url: ${LMSTUDIO_MACBOOK_AIR_BASE_URL:-http://scotts-macbook-air.tailcb8954.ts.net:1234/v1}
    priority: 150
    quota_class: local
    parallel_slots: 2
    queue_limit: 0
    queue_timeout_seconds: 0
    models:
      - alias: local/quick-iterate
        provider_model: qwen3.5-0.8b-mlx
        capabilities: [chat, streaming, json, image_input, vision, low_latency, local_only, quick_iteration, reasoning]
        context_window: 262144
      - alias: local/tool-call
        provider_model: refinedtoolcallv5-3b
        capabilities: [chat, streaming, code, json, local_only, hermes_worker, tool_use]
        context_window: 131072

  - name: lmstudio-destroyer
    type: lmstudio
    node_id: destroyer
    enabled: true
    base_url: ${LMSTUDIO_DESTROYER_BASE_URL:-http://destroyer.tailcb8954.ts.net:1234/v1}
    priority: 130
    quota_class: local
    models:
      - alias: local/destroyer-8b
        provider_model: lfm2.5-8b-a1b
        capabilities: [chat, reasoning, streaming, json, local_only, hermes_worker]
        context_window: 131072
      - alias: local/destroyer-3b
        provider_model: vibethinker-3b-hermes
        capabilities: [chat, streaming, code, json, local_only, hermes_worker, tool_use]
        context_window: 131072

  - name: lmstudio-r2d2
    node_id: r2d2
    type: lmstudio
    enabled: true
    base_url: ${LMSTUDIO_R2D2_BASE_URL:-http://r2d2:1234/v1}
    priority: 900
    quota_class: local
    models:
      - alias: local/default
        provider_model: local/default
        capabilities: [chat, streaming, code, json, local_only]
        context_window: 32768
