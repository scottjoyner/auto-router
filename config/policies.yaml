# Strict offline routing policies.
# Every profile resolves only to local physical runtimes. Hosted provider classes
# are intentionally absent, including flash-start and quota-burn lanes.
profiles:
  interactive_balanced:
    description: Select the best admitted local model for normal interactive work.
    stages:
      - purpose: final
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true

  local_planner:
    description: Use a low-latency local model for planning and decomposition.
    stages:
      - purpose: draft
        provider_classes: [local]
        required_capabilities: [chat, low_latency]
        allow_local_fallback: true
      - purpose: refine
        provider_classes: [local]
        required_capabilities: [chat, reasoning]
        allow_local_fallback: true
        optional: true

  high_priority_deliverable:
    description: Local draft, local refine, and optional local judge.
    stages:
      - purpose: draft
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true
      - purpose: refine
        provider_classes: [local]
        required_capabilities: [chat, reasoning]
        allow_local_fallback: true
        optional: true
      - purpose: judge
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true
        optional: true

  code_high_quality:
    description: Local coding draft and local refinement for Hermes or OpenCode.
    stages:
      - purpose: draft
        provider_classes: [local]
        required_capabilities: [chat, code]
        allow_local_fallback: true
      - purpose: refine
        provider_classes: [local]
        required_capabilities: [chat, code]
        allow_local_fallback: true
        optional: true

  iterative_review_handoff:
    description: Local iteration and review before a Hermes handoff.
    stages:
      - purpose: draft
        provider_classes: [local]
        required_capabilities: [chat, low_latency, quick_iteration]
        allow_local_fallback: true
      - purpose: refine
        provider_classes: [local]
        required_capabilities: [chat, reasoning, large_context]
        allow_local_fallback: true
        optional: true
      - purpose: judge
        provider_classes: [local]
        required_capabilities: [chat, reasoning]
        allow_local_fallback: true
        optional: true

  sophia_realtime:
    description: Low-latency local-only lane for realtime private traffic.
    stages:
      - purpose: final
        provider_classes: [local, fast_free]
        required_capabilities: [chat, low_latency]
        allow_local_fallback: true

  backlog_local:
    description: Local-only batch processing; never burn hosted quota.
    stages:
      - purpose: draft
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true
      - purpose: refine
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true
        optional: true

  summarization_local:
    description: Route summaries to admitted full or auxiliary workers using summarization benchmarks.
    stages:
      - purpose: final
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true

  compression_local:
    description: Route context compression to admitted full or auxiliary workers using compression benchmarks.
    stages:
      - purpose: final
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true

  extraction_local:
    description: Route structured extraction to admitted full or auxiliary workers using extraction benchmarks.
    stages:
      - purpose: final
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true

  local_only:
    description: Never leave approved local endpoints.
    stages:
      - purpose: final
        provider_classes: [local]
        required_capabilities: [chat]
        allow_local_fallback: true

classification:
  default_profile: interactive_balanced
  model_alias_profiles:
    auto/fast: interactive_balanced
    auto/flash-start: local_planner
    auto/high-quality: high_priority_deliverable
    auto/code: code_high_quality
    auto/review: iterative_review_handoff
    auto/iterate: iterative_review_handoff
    auto/finalize: iterative_review_handoff
    auto/sophia: sophia_realtime
    auto/backlog-burn: backlog_local
    auto/summarize: summarization_local
    auto/summary: summarization_local
    auto/compress: compression_local
    auto/compact: compression_local
    auto/extract: extraction_local
    auto/parse: extraction_local
    auto/local: local_only
    auto/private: local_only
  local_only_markers:
    - local_only
    - private_data
    - internal_docs
    - personal_docs
    - voice_auth
    - enrollment_sample
  surplus_burn_markers:
    - backlog
    - refine_later
    - doc_review
    - test_generation
    - summarization
    - compression
    - extraction
