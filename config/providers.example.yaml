providers:
  # Agentgateway sidecar (optional first-class gateway)
  - id: agentgateway-sidecar
    name: agentgateway sidecar
    type: openai_compatible
    enabled: true
    base_url: ${AUTO_ROUTER_AGENTGATEWAY_OPENAI_BASE_URL:-http://agentgateway:3000/v1}
    api_key_env: AUTO_ROUTER_AGENTGATEWAY_API_KEY
    priority: 50
    quota_class: brokered_free
    headers: {}
    gateway_managed: true  # Route through agentgateway when enabled
    local_gateway_only: false  # Can route to cloud providers via gateway
    models: []

  - name: groq
    type: openai_compatible
    enabled: true
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    priority: 20
    quota_class: fast_free
    headers: {}
    models:
      - alias: groq/fast-small
        provider_model: llama-3.1-8b-instant
        capabilities: [chat, streaming, json, low_latency]
        context_window: 8192
        quota:
          rpm: 5
          tpd: 500000

  - name: cerebras
    type: openai_compatible
    enabled: true
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    priority: 10
    quota_class: fast_free
    headers: {}
    metadata:
      role: flash_start_planning_node
      docs: https://inference-docs.cerebras.ai
      notes: Public docs currently list gpt-oss-120b and preview zai-glm-4.7 on shared endpoints. Confirm live availability with GET /v1/models.
    models:
      - alias: cerebras/flash-reasoner
        provider_model: gpt-oss-120b
        capabilities: [chat, streaming, json, code, reasoning, low_latency, flash_planning]
        quota:
          rpm: 5
          tpm: 30000
          tph: 1000000
          tpd: 1000000
      - alias: cerebras/glm-4.7-preview
        provider_model: zai-glm-4.7
        capabilities: [chat, streaming, json, code, reasoning, tool_use, low_latency, flash_planning, preview]
        quota:
          rpm: 5
          tpm: 30000
          tph: 1000000
          tpd: 1000000

  - name: openrouter
    type: openai_compatible
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    priority: 80
    quota_class: brokered_free
    headers:
      HTTP-Referer: http://localhost:8088
      X-Title: auto-router
    models:
      - alias: openrouter/free-general
        provider_model: meta-llama/llama-3.1-8b-instruct:free
        capabilities: [chat, streaming]
        context_window: 8192
        quota:
          rpm: 20
          rpd: 50

  - name: lmstudio-r2d2
    type: lmstudio
    enabled: true
    base_url: ${LMSTUDIO_R2D2_BASE_URL:-http://r2d2:1234/v1}
    priority: 900
    quota_class: local
    models:
      - alias: local/default
        provider_model: local/default
        capabilities: [chat, streaming, code, json, local_only]
        context_window: 32768

  - name: lmstudio-deathstar
    type: lmstudio
    enabled: true
    base_url: ${LMSTUDIO_DEATHSTAR_BASE_URL:-http://deathstar-XPS-8920:1234/v1}
    priority: 910
    quota_class: local
    models:
      - alias: local/batch
        provider_model: local/batch
        capabilities: [chat, streaming, code, json, local_only]
        context_window: 32768
