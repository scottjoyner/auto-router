# Strict offline provider example.
#
# Only physical loopback, LAN, or Tailscale runtimes belong here. Hosted inference
# providers and broker gateways are intentionally excluded from the fleet system.
providers:
  - name: lmstudio-primary
    type: lmstudio
    node_id: x1-370
    enabled: true
    base_url: ${LMSTUDIO_PRIMARY_BASE_URL:-http://host.docker.internal:1234/v1}
    priority: 100
    quota_class: local
    models:
      - alias: local/default
        provider_model: local/default
        capabilities: [chat, streaming, code, json, local_only, hermes_worker]
        context_window: 32768

  - name: lmstudio-tailnet-worker
    type: lmstudio
    node_id: replace-with-physical-node-id
    enabled: false
    base_url: ${LMSTUDIO_WORKER_BASE_URL:-http://replace-with-tailnet-host:1234/v1}
    priority: 150
    quota_class: local
    models: []
