name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile reconciliation paths
        run: |
          python -m py_compile \
            src/auto_router/claim_fence.py \
            src/auto_router/executor_auth.py \
            src/auto_router/request_idempotency.py \
            src/auto_router/runtime_projection_v2.py \
            src/auto_router/secure_live.py \
            src/auto_router/stream_lifecycle.py
      - name: Lint reconciliation paths
        # The blocking lint gate focuses on correctness. Style/import ordering is
        # retained as a visible non-blocking audit while this large migration lands.
        run: |
          ruff check --ignore I001,E501,UP012,UP018 \
            src/auto_router/access_paths.py \
            src/auto_router/admission.py \
            src/auto_router/claim_fence.py \
            src/auto_router/executor_auth.py \
            src/auto_router/main_live.py \
            src/auto_router/models.py \
            src/auto_router/offline_guard.py \
            src/auto_router/request_idempotency.py \
            src/auto_router/route_events.py \
            src/auto_router/runtime_projection.py \
            src/auto_router/runtime_projection_v2.py \
            src/auto_router/secure_live.py \
            src/auto_router/stream_lifecycle.py \
            src/auto_router/strict_assistx_routes.py \
            scripts/verify_reconciliation_network.py \
            tests/test_access_paths.py \
            tests/test_admission.py \
            tests/test_claim_fence.py \
            tests/test_executor_auth.py \
            tests/test_offline_guard.py \
            tests/test_reconciliation_config.py \
            tests/test_reconciliation_runtime.py \
            tests/test_request_idempotency.py \
            tests/test_runtime_projection.py \
            tests/test_runtime_projection_v2.py \
            tests/test_runtime_telemetry.py \
            tests/test_stream_lifecycle.py \
            tests/test_strict_assistx_routes.py \
            tests/test_flash_start.py \
            tests/test_main_health.py
      - name: Formatting audit
        continue-on-error: true
        run: |
          ruff check --select I,E501,UP012,UP018 \
            src/auto_router/claim_fence.py \
            src/auto_router/executor_auth.py \
            src/auto_router/main_live.py \
            src/auto_router/models.py \
            src/auto_router/request_idempotency.py \
            src/auto_router/route_events.py \
            src/auto_router/runtime_projection.py \
            src/auto_router/runtime_projection_v2.py \
            src/auto_router/secure_live.py \
            src/auto_router/stream_lifecycle.py \
            src/auto_router/strict_assistx_routes.py \
            tests/test_claim_fence.py \
            tests/test_executor_auth.py \
            tests/test_request_idempotency.py \
            tests/test_runtime_projection.py \
            tests/test_runtime_projection_v2.py \
            tests/test_runtime_telemetry.py \
            tests/test_stream_lifecycle.py \
            tests/test_strict_assistx_routes.py
      - name: Audit legacy repository lint backlog
        # The repository predates the current Ruff gate and contains a large
        # unrelated backlog. Keep it visible without blocking the mounted runtime.
        continue-on-error: true
        run: ruff check src tests
      - name: Type check (mypy)
        # Preserve the existing non-blocking type audit until the dedicated
        # repository-wide type-hygiene pass lands.
        continue-on-error: true
        run: mypy src/auto_router
      - name: Test mounted reconciliation runtime
        run: bash scripts/test_reconciliation.sh

  integration-smoke:
    runs-on: ubuntu-latest
    # Sigstore OIDC is used only by the guarded internal PR archive-attestation step.
    # It never grants registry push, live deployment, or owner approval.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    # Job-level, not step-level: the teardown step runs `if: always()` and compose
    # interpolates on `down` exactly as it does on `up`, so a step-scoped value
    # left teardown failing on a missing variable after the build had passed.
    #
    # AUTO_ROUTER_PROJECTION_PUBLIC_KEY_FILE is required (`:?`) by
    # docker-compose.yml so a missing key file fails at `up` rather than being
    # silently bind-mounted as an empty directory by docker. The integration
    # override replaces llm-router's volumes wholesale, so this path is never read
    # here - it only has to satisfy interpolation, which compose performs on the
    # base file before the override is merged.
    env:
      AUTO_ROUTER_INTERNAL_SERVICE_TOKEN: smoke-service-token
      AUTO_ROUTER_PROJECTION_PUBLIC_KEY_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
      - name: Build and start strict-offline router + redis
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml up -d --build
      - name: Wait for health
        run: |
          healthy=false
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8088/health >/dev/null; then
              echo "router healthy"
              healthy=true
              break
            fi
            sleep 3
          done
          test "$healthy" = "true"
      - name: Verify health, offline models, authenticated inference, route surface, admission, projection, and admin auth gate
        run: |
          curl -sf http://127.0.0.1:8088/health > /tmp/router-health.json
          curl -sf http://127.0.0.1:8088/openapi.json > /tmp/router-openapi.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/router-health.json").read_text())
          assert health.get("service") == "auto-router", health

          paths = set(json.loads(Path("/tmp/router-openapi.json").read_text())["paths"])
          required = {
              "/health",
              "/v1/models",
              "/v1/chat/completions",
              "/api/routes/request",
              "/admin/admission",
              "/admin/runtime-projection",
          }
          forbidden = {
              "/admin/backlog/burn-down",
              "/admin/backlog/dry-run",
              "/admin/live-models",
              "/admin/services/scan",
              "/admin/agent-clis/discover",
              "/jobs/agent",
          }
          assert required <= paths, sorted(required - paths)
          assert not (forbidden & paths), sorted(forbidden & paths)
          PY

          curl -sf http://127.0.0.1:8088/v1/models > /tmp/router-models.json
          python - <<'PY'
          import json
          from pathlib import Path

          forbidden = {
              "openrouter",
              "cerebras",
              "groq",
              "grok",
              "xai",
              "anthropic",
              "gemini",
              "mistral",
              "cloudflare",
          }
          payload = json.loads(Path("/tmp/router-models.json").read_text())
          serialized = json.dumps(payload).lower()
          assert not any(name in serialized for name in forbidden), payload
          PY

          # Inference must fail at the authentication boundary without a token.
          unauth_code=$(curl -s -o /tmp/router-unauth-inference.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: unauthenticated-must-not-reserve' \
            -d '{"model":"auto/local","messages":[{"role":"user","content":"smoke"}],"max_tokens":8}' \
            http://127.0.0.1:8088/v1/chat/completions)
          echo "unauthenticated inference: $unauth_code"
          test "$unauth_code" = "401"

          # Broad service identity must now fail at the inference authentication
          # boundary, before any quota reservation, provider attempt, or
          # idempotency ledger mutation. Neither retry nor duplicate may run.
          service_code=$(curl -s -o /tmp/router-service-inference.json -w '%{http_code}' \
            -H 'Authorization: Bearer smoke-service-token' \
            -H 'Idempotency-Key: unscoped-service-must-deny' \
            -H 'Content-Type: application/json' \
            -d '{"model":"auto/local","messages":[{"role":"user","content":"smoke"}],"max_tokens":8}' \
            http://127.0.0.1:8088/v1/chat/completions)
          echo "unscoped service inference: $service_code"
          test "$service_code" = "401"
          python - <<'PYSMOKE'
          import json
          with open("/tmp/router-service-inference.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("detail") == "internal service token cannot authorize inference", data
          PYSMOKE

          duplicate_code=$(curl -s -o /tmp/router-duplicate-inference.json -w '%{http_code}' \
            -H 'Authorization: Bearer smoke-service-token' \
            -H 'Idempotency-Key: unscoped-service-must-deny' \
            -H 'Content-Type: application/json' \
            -d '{"model":"auto/local","messages":[{"role":"user","content":"smoke"}],"max_tokens":8}' \
            http://127.0.0.1:8088/v1/chat/completions)
          echo "unscoped duplicate inference: $duplicate_code"
          test "$duplicate_code" = "401"
          python - <<'PYSMOKE'
          import json
          with open("/tmp/router-duplicate-inference.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("detail") == "internal service token cannot authorize inference", data
          PYSMOKE

          # Administrative status must require the local admin token.
          for path in /admin/quota /admin/admission /admin/runtime-projection; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8088$path")
            echo "unauthenticated $path: $code"
            test "$code" = "401"
          done

          # The same endpoints succeed with the local admin token.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Admin-Token: smoke-admin-token' \
            http://127.0.0.1:8088/admin/quota)
          echo "authenticated admin status: $code"
          test "$code" = "200"

          curl -sf \
            -H 'X-Admin-Token: smoke-admin-token' \
            http://127.0.0.1:8088/admin/admission > /tmp/router-admission.json
          curl -sf \
            -H 'X-Admin-Token: smoke-admin-token' \
            http://127.0.0.1:8088/admin/runtime-projection > /tmp/router-projection.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/router-admission.json").read_text())
          assert isinstance(payload.get("runtimes"), list), payload
          assert isinstance(payload.get("access_paths"), list), payload
          assert isinstance(payload.get("runtime_projection"), dict), payload
          for runtime in payload["runtimes"]:
              required = {"runtime_instance_id", "parallel_slots", "active", "queued"}
              assert required <= set(runtime), runtime
          for runtime in payload["access_paths"]:
              required = {
                  "runtime_instance_id",
                  "approved_access_urls",
                  "selected_access_url",
              }
              assert required <= set(runtime), runtime

          projection = json.loads(Path("/tmp/router-projection.json").read_text())
          assert projection.get("configured") is False, projection
          assert projection.get("current") is None, projection
          assert isinstance(projection.get("retired_generations"), list), projection
          PY
      - name: Verify complete mounted admin GET and POST negative-auth surface
        env:
          AUTO_ROUTER_CANARY_ENV: disposable-github-ci
          AUTO_ROUTER_CANARY_SYNTHETIC_ADMIN_TOKEN: smoke-admin-token
        run: python3 scripts/verify_admin_surface_exhaustive.py
      - name: Verify disposable legacy Router admin and discovery client parity
        env:
          AUTO_ROUTER_CANARY_ENV: disposable-github-ci
          AUTO_ROUTER_CANARY_SYNTHETIC_ADMIN_TOKEN: smoke-admin-token
        run: python3 scripts/verify_router_legacy_client_ci.py
      - name: Verify disposable full-ASGI admin auth and sanitized provider snapshot
        env:
          AUTO_ROUTER_CANARY_ENV: disposable-github-ci
          AUTO_ROUTER_CANARY_SYNTHETIC_ADMIN_TOKEN: smoke-admin-token
        run: python3 scripts/write_ci_admin_release_evidence.py
      - name: Upload non-secret exact-image canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: router-admin-auth-evidence-${{ github.sha }}
          path: /tmp/auto-router-admin-ci-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Package tested Router image for offline, non-production handoff
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023'
        env:
          AUTO_ROUTER_CI_IMAGE_PACKAGE: unpromoted-disposable-only
        run: python3 scripts/package_ci_router_image.py
      - name: Independently verify packaged OCI archive without Docker import
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import zipfile

          root = Path("/tmp/router-ci-image-handoff")
          receipt = json.loads((root / "image-manifest.json").read_text())
          target = root / "self-check.zip"
          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_STORED) as bundle:
              for name in ("image-manifest.json", "tested-router-image.tar.gz"):
                  bundle.write(root / name, arcname=name)
          try:
              subprocess.run([
                  sys.executable, "scripts/verify_router_handoff_offline.py",
                  "--zip", str(target),
                  "--expected-image", receipt["image_id"],
                  "--expected-source", os.environ["GITHUB_SHA"],
                  "--expected-archive-sha256", receipt["archive_sha256"],
              ], check=True, timeout=80)
          finally:
              target.unlink(missing_ok=True)
          PY
      # Authentication of CI-built archive bytes via GitHub OIDC + Sigstore.
      # This is NOT independently governed production signer approval,
      # not a reproducible-build proof, and not release/promotion authority.
      - name: Attest exact verified Router OCI archive (CI-only, unpromoted)
        id: attest_router
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: /tmp/router-ci-image-handoff/tested-router-image.tar.gz
      # GitHub CLI performs Sigstore trust-root, certificate and transparency
      # validation independently from the action that generated the bundle.
      # This remains a *CI build* receipt, not separate release authorization.
      - name: Verify Sigstore archive attestation against trusted roots
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in 1 2 3; do
            if gh attestation verify /tmp/router-ci-image-handoff/tested-router-image.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "refs/pull/${{ github.event.pull_request.number }}/merge" \
              >/dev/null 2>&1; then
              echo 'SIGSTORE_TRUSTED_ROOT_CI_ARCHIVE_VERIFY_PASS_NOT_RELEASE_AUTHORITY'
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo 'SIGSTORE_TRUSTED_ROOT_CI_ARCHIVE_VERIFY_HOLD'
          exit 2
      - name: Upload public Sigstore CI provenance bundle (not release approval)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: router-ci-sigstore-bundle-${{ github.sha }}
          path: ${{ steps.attest_router.outputs['bundle-path'] }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload tested Router image and receipt (not a production deployment)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023'
        uses: actions/upload-artifact@v4
        with:
          name: router-image-handoff-${{ github.sha }}
          path: /tmp/router-ci-image-handoff/
          if-no-files-found: error
          retention-days: 3
      # Only the same-repository guarded PR may rehearse a synthetic fallback.
      # This is not a production image switch or an authorization to use live secrets.
      - name: Fetch immutable guarded-main recovery source (disposable CI)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          repository: scottjoyner/auto-router
          ref: bd2bc73e3d10ea549c03b6b8f35359c2dc8ea943
          path: .ci-guarded-main-recovery
          persist-credentials: false
      - name: Rehearse security-preserving isolated Router fallback (CI-only)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          AUTO_ROUTER_CI_ROLLBACK_MODE: synthetic-disposable-no-prod
        run: |
          set -euo pipefail
          test "$AUTO_ROUTER_CI_ROLLBACK_MODE" = "synthetic-disposable-no-prod"
          test "$(git -C "$GITHUB_WORKSPACE/.ci-guarded-main-recovery" rev-parse HEAD)" = "bd2bc73e3d10ea549c03b6b8f35359c2dc8ea943"
          CI_SOURCE_SHA="$(git rev-parse HEAD)"
          test "$CI_SOURCE_SHA" = "$GITHUB_SHA"
          ORIGINAL_IMAGE="$(docker inspect --format '{{.Image}}' auto-router-smoke)"
          VERIFIED_IMAGE="$(python3 -c 'import json;print(json.load(open("/tmp/router-ci-image-handoff/image-manifest.json"))["image_id"])')"
          test "$ORIGINAL_IMAGE" = "$VERIFIED_IMAGE"
          ROOT="$GITHUB_WORKSPACE"
          RECOVERY="$ROOT/.ci-guarded-main-recovery"
          cleanup() {
            ( cd "$RECOVERY" && docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v ) >/dev/null 2>&1 || true
            ( cd "$ROOT" && docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v ) >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # Candidate -> independently pinned guarded main, with throwaway Redis,
          # container, networks, config and sqlite volume; no fleet mounts/secrets.
          docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v
          cd "$RECOVERY"
          docker compose -f docker-compose.yml -f docker-compose.integration.yml up -d --build
          HEALTHY=0
          for attempt in $(seq 1 25); do
            if curl --silent --fail --output /dev/null --max-time 2 http://127.0.0.1:8088/health; then
              HEALTHY=1
              break
            fi
            sleep 2
          done
          test "$HEALTHY" = 1
          RECOVERY_IMAGE="$(docker inspect --format '{{.Image}}' auto-router-smoke)"
          test "$RECOVERY_IMAGE" != "$ORIGINAL_IMAGE"
          # All mounted admin methods must deny missing/incorrect credentials.
          # Only the public OpenAPI *schema* is read; no admin bodies or token
          # values, and no authorized POST mutations, are ever collected.
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base="http://127.0.0.1:8088"
          with urllib.request.urlopen(base+"/openapi.json",timeout=4) as resp:
              raw=resp.read(256001)
          assert len(raw)<=256000
          schema=json.loads(raw)
          operations=set()
          methods={"get","post","put","patch","delete","head","options","trace"}
          for path,routes in schema["paths"].items():
              if path.startswith("/admin/"):
                  for method in routes:
                      if method in methods:
                          operations.add((method.upper(),path))
          expected={("GET",p) for p in (
              "/admin/quota","/admin/providers/health","/admin/context",
              "/admin/context/graph","/admin/providers","/admin/placement",
              "/admin/agent-workers","/admin/usage","/admin/circuits",
              "/admin/agent-jobs","/admin/admission",
              "/admin/runtime-projection","/admin/ops/summary",
              "/admin/ops/preflight","/admin/memory")}
          expected|={("POST",p) for p in (
              "/admin/load","/admin/circuits/reset",
              "/admin/circuits/reset/{owner}","/admin/runtime-projection")}
          assert operations==expected,(len(operations),len(expected))
          def code(method,path,token=None):
              headers={"Accept":"application/json"}
              if token is not None:headers["X-Admin-Token"]=token
              real=path.replace("{owner}","ci-disposable-owner")
              assert real.startswith("/admin/")
              request=urllib.request.Request(base+real,headers=headers,
                  data=b"{}" if method=="POST" else None,method=method)
              try:
                  with urllib.request.urlopen(request,timeout=4) as response:
                      return response.status
              except urllib.error.HTTPError as e:
                  e.close()
                  return e.code
          for method,path in sorted(expected):
              for token in (None,"ci-incorrect-admin-token"):
                  assert code(method,path,token)==401,(method,path)
          assert code("GET","/admin/providers","smoke-admin-token")==200
          assert code("GET","/admin/admission","smoke-admin-token")==200
          for path in ("/health","/v1/models"):
              with urllib.request.urlopen(base+path,timeout=4) as response:
                  assert response.status==200
          print(json.dumps({"verdict":"DISPOSABLE_GUARDED_MAIN_ROLLBACK_AUTH_AND_HEALTH_PASS",
              "mounted_admin_operations":len(expected),
              "anonymous_and_wrong_denials":len(expected)*2,
              "positive_admin_reads":2,"public_reads":2,
              "initial_candidate_was_verified_by_OCI_receipt":True,
              "fallback_git_commit":"bd2bc73e3d10ea549c03b6b8f35359c2dc8ea943",
              "production_rollout_or_rollback_tested":False,
              "no_real_model_requests":True,"no_real_credentials":True,
              "release_authorized":False},sort_keys=True))
          PY
          test "$(docker inspect --format '{{.Image}}' auto-router-smoke)" = "$RECOVERY_IMAGE"
          # Preserve only the tested, security-patched fallback CI image.
          # Never export any fleet image, private volume or production secret.
          export RECOVERY_IMAGE
          mkdir -p /tmp/router-guarded-main-rollback-ci
          docker save "$RECOVERY_IMAGE" | gzip -n -1 > /tmp/router-guarded-main-rollback-ci/guarded-main-image.tar.gz
          gzip -t /tmp/router-guarded-main-rollback-ci/guarded-main-image.tar.gz
          python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path("/tmp/router-guarded-main-rollback-ci")
          archive=root/"guarded-main-image.tar.gz"
          image=os.environ["RECOVERY_IMAGE"]
          assert image.startswith("sha256:") and len(image)==71
          assert 0 < archive.stat().st_size < 500_000_000
          def hash_file(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for block in iter(lambda:f.read(1024*1024),b""): h.update(block)
              return h.hexdigest()
          with tarfile.open(archive,mode="r:gz") as tf:
              manifest=json.load(tf.extractfile("manifest.json"))
              assert len(manifest)==1
              item=manifest[0]
              config_bytes=tf.extractfile(item["Config"]).read()
              assert "sha256:"+hashlib.sha256(config_bytes).hexdigest()==image
              config=json.loads(config_bytes)
              layers=item["Layers"];diff_ids=config["rootfs"]["diff_ids"]
              assert len(layers)==len(diff_ids) and len(layers)>=5
              for name,expect in zip(layers,diff_ids):
                  h=hashlib.sha256()
                  with tf.extractfile(name) as layer:
                      for block in iter(lambda:layer.read(1024*1024),b""):h.update(block)
                  assert "sha256:"+h.hexdigest()==expect
          receipt={
              "schema":1,"verdict":"DISPOSABLE_PATCHED_MAIN_FALLBACK_IMAGE_INTEGRITY_PASS",
              "source_git_commit":"bd2bc73e3d10ea549c03b6b8f35359c2dc8ea943",
              "subject_ci_commit":os.environ["GITHUB_SHA"],
              "tested_fallback_image":image,
              "image_archive_sha256":hash_file(archive),
              "image_archive_size_bytes":archive.stat().st_size,
              "layer_diffid_count":len(layers),
              "negative_admin_denials":38,
              "positive_admin_get_reads":2,
              "public_get_reads":2,
              "synthetic_only":True,"production_image_replaced":False,
              "physical_rollback_verified":False,
              "operator_release_approved":False
          }
          (root/"guarded-main-fallback-receipt.json").write_text(json.dumps(receipt,sort_keys=True)+"\\n")
          print(json.dumps({"verdict":receipt["verdict"],"image":image,
              "layers":len(layers),"sha256":receipt["image_archive_sha256"],
              "production_rollback_verified":False},sort_keys=True))
          PY
      # Staged guardrail only: a CI-signed fallback is not release authority.
      - name: Attest CI-rehearsed security-patched fallback image (unpromoted)
        id: attest_patched_fallback
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@v4
        with:
          subject-path: /tmp/router-guarded-main-rollback-ci/guarded-main-image.tar.gz
      - name: Verify patched fallback archive under GitHub Sigstore trust roots
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh attestation verify /tmp/router-guarded-main-rollback-ci/guarded-main-image.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "refs/pull/${{ github.event.pull_request.number }}/merge" >/dev/null
          echo 'GUARDED_MAIN_FALLBACK_SIGSTORE_CI_TRUST_PASS_NOT_PRODUCTION_SIGNOFF'
      - name: Upload guarded-main fallback image and rollback witness (not deployed)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: router-guarded-main-fallback-${{ github.sha }}
          path: /tmp/router-guarded-main-rollback-ci/
          if-no-files-found: error
          retention-days: 3
      - name: Upload Sigstore fallback bundle (not production signer approval)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/inherited-admin-exact-head-regression-20261023' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: router-guarded-main-sigstore-${{ github.sha }}
          path: ${{ steps.attest_patched_fallback.outputs['bundle-path'] }}
          if-no-files-found: error
          retention-days: 14
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.integration.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.integration.yml logs --no-color --tail=300 || true
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v
