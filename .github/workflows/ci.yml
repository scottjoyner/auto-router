name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Type check (mypy)
        # mypy runs against the repo config; surfaces type errors without
        # blocking the gate until the fleet-wide type-hygiene pass lands.
        continue-on-error: true
        run: mypy src/auto_router
      - name: Test
        run: pytest -q

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start router + redis
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8088/health >/dev/null; then
              echo "router healthy"; break
            fi
            sleep 3
          done
      - name: Verify health + admin auth gate
        run: |
          curl -sf http://localhost:8088/health | grep -q '"service": "auto-router"'
          # /admin/quota must require the admin token (401 without it)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/admin/quota)
          test "$code" = "401"
          # and succeed with the token
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Admin-Token: smoke-admin-token' http://localhost:8088/admin/quota)
          test "$code" = "200"
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v
