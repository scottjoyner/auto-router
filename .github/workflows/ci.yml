name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint reconciliation paths
        run: |
          ruff check \
            src/auto_router/main_live.py \
            src/auto_router/offline_guard.py \
            tests/test_offline_guard.py \
            tests/test_reconciliation_config.py
      - name: Audit legacy repository lint backlog
        # The repository predates the current Ruff gate and currently contains a
        # large unrelated backlog. Report it without preventing focused tests and
        # reconciliation gates from running. Remove continue-on-error only after
        # a dedicated baseline cleanup lands.
        continue-on-error: true
        run: ruff check src tests
      - name: Type check (mypy)
        # mypy runs against the repo config; surfaces type errors without
        # blocking the gate until the fleet-wide type-hygiene pass lands.
        continue-on-error: true
        run: mypy src/auto_router
      - name: Test
        run: pytest -q

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start strict-offline router + redis
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml up -d --build
      - name: Wait for health
        run: |
          healthy=false
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8088/health >/dev/null; then
              echo "router healthy"
              healthy=true
              break
            fi
            sleep 3
          done
          test "$healthy" = "true"
      - name: Verify health, offline models, and admin auth gate
        run: |
          curl -sf http://127.0.0.1:8088/health > /tmp/router-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/router-health.json").read_text())
          assert payload.get("service") == "auto-router", payload
          PY

          curl -sf http://127.0.0.1:8088/v1/models > /tmp/router-models.json
          python - <<'PY'
          import json
          from pathlib import Path

          forbidden = {
              "openrouter",
              "cerebras",
              "groq",
              "grok",
              "xai",
              "anthropic",
              "gemini",
              "mistral",
              "cloudflare",
          }
          payload = json.loads(Path("/tmp/router-models.json").read_text())
          serialized = json.dumps(payload).lower()
          assert not any(name in serialized for name in forbidden), payload
          PY

          # /admin/quota must require the admin token (401 without it).
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8088/admin/quota)
          echo "unauthenticated admin status: $code"
          test "$code" = "401"

          # The same endpoint succeeds with the local admin token.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Admin-Token: smoke-admin-token' \
            http://127.0.0.1:8088/admin/quota)
          echo "authenticated admin status: $code"
          test "$code" = "200"
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.integration.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.integration.yml logs --no-color --tail=300 || true
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v
