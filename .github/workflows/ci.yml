name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint reconciliation paths
        run: |
          ruff check \
            src/auto_router/access_paths.py \
            src/auto_router/admission.py \
            src/auto_router/main_live.py \
            src/auto_router/models.py \
            src/auto_router/offline_guard.py \
            src/auto_router/route_events.py \
            src/auto_router/runtime_projection.py \
            scripts/verify_reconciliation_network.py \
            tests/test_access_paths.py \
            tests/test_admission.py \
            tests/test_offline_guard.py \
            tests/test_reconciliation_config.py \
            tests/test_reconciliation_runtime.py \
            tests/test_runtime_projection.py \
            tests/test_runtime_telemetry.py \
            tests/test_flash_start.py \
            tests/test_main_health.py
      - name: Audit legacy repository lint backlog
        # The repository predates the current Ruff gate and contains a large
        # unrelated backlog. Keep it visible without blocking the mounted runtime.
        continue-on-error: true
        run: ruff check src tests
      - name: Type check (mypy)
        # Preserve the existing non-blocking type audit until the dedicated
        # repository-wide type-hygiene pass lands.
        continue-on-error: true
        run: mypy src/auto_router
      - name: Test mounted reconciliation runtime
        run: bash scripts/test_reconciliation.sh

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start strict-offline router + redis
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml up -d --build
      - name: Wait for health
        run: |
          healthy=false
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8088/health >/dev/null; then
              echo "router healthy"
              healthy=true
              break
            fi
            sleep 3
          done
          test "$healthy" = "true"
      - name: Verify health, offline models, route surface, admission, projection, and admin auth gate
        run: |
          curl -sf http://127.0.0.1:8088/health > /tmp/router-health.json
          curl -sf http://127.0.0.1:8088/openapi.json > /tmp/router-openapi.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/router-health.json").read_text())
          assert health.get("service") == "auto-router", health

          paths = set(json.loads(Path("/tmp/router-openapi.json").read_text())["paths"])
          required = {
              "/health",
              "/v1/models",
              "/api/routes/request",
              "/admin/admission",
              "/admin/runtime-projection",
          }
          forbidden = {
              "/admin/backlog/burn-down",
              "/admin/backlog/dry-run",
              "/admin/live-models",
              "/admin/services/scan",
              "/admin/agent-clis/discover",
              "/jobs/agent",
          }
          assert required <= paths, sorted(required - paths)
          assert not (forbidden & paths), sorted(forbidden & paths)
          PY

          curl -sf http://127.0.0.1:8088/v1/models > /tmp/router-models.json
          python - <<'PY'
          import json
          from pathlib import Path

          forbidden = {
              "openrouter",
              "cerebras",
              "groq",
              "grok",
              "xai",
              "anthropic",
              "gemini",
              "mistral",
              "cloudflare",
          }
          payload = json.loads(Path("/tmp/router-models.json").read_text())
          serialized = json.dumps(payload).lower()
          assert not any(name in serialized for name in forbidden), payload
          PY

          # Administrative status must require the local admin token.
          for path in /admin/quota /admin/admission /admin/runtime-projection; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8088$path")
            echo "unauthenticated $path: $code"
            test "$code" = "401"
          done

          # The same endpoints succeed with the local admin token.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Admin-Token: smoke-admin-token' \
            http://127.0.0.1:8088/admin/quota)
          echo "authenticated admin status: $code"
          test "$code" = "200"

          curl -sf \
            -H 'X-Admin-Token: smoke-admin-token' \
            http://127.0.0.1:8088/admin/admission > /tmp/router-admission.json
          curl -sf \
            -H 'X-Admin-Token: smoke-admin-token' \
            http://127.0.0.1:8088/admin/runtime-projection > /tmp/router-projection.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/router-admission.json").read_text())
          assert isinstance(payload.get("runtimes"), list), payload
          assert isinstance(payload.get("access_paths"), list), payload
          assert isinstance(payload.get("runtime_projection"), dict), payload
          for runtime in payload["runtimes"]:
              required = {"runtime_instance_id", "parallel_slots", "active", "queued"}
              assert required <= set(runtime), runtime
          for runtime in payload["access_paths"]:
              required = {
                  "runtime_instance_id",
                  "approved_access_urls",
                  "selected_access_url",
              }
              assert required <= set(runtime), runtime

          projection = json.loads(Path("/tmp/router-projection.json").read_text())
          assert projection.get("configured") is False, projection
          assert projection.get("current") is None, projection
          assert isinstance(projection.get("retired_generations"), list), projection
          PY
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.integration.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.integration.yml logs --no-color --tail=300 || true
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v
