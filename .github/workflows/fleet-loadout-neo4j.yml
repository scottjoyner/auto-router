name: Fleet loadout Neo4j contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_fleet_loadouts.py'
      - 'src/auto_router/fleet_task_dispatcher.py'
      - 'tests/test_fleet_loadout_neo4j_integration.py'
      - '.github/workflows/fleet-loadout-neo4j.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_fleet_loadouts.py'
      - 'src/auto_router/fleet_task_dispatcher.py'
      - 'tests/test_fleet_loadout_neo4j_integration.py'
      - '.github/workflows/fleet-loadout-neo4j.yml'

permissions:
  contents: read

jobs:
  neo4j-contract:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_INTEGRATION: '1'
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile and lint contract paths
        run: |
          python -m py_compile scripts/build_fleet_loadouts.py tests/test_fleet_loadout_neo4j_integration.py
          ruff check --ignore E402,E501,UP017 scripts/build_fleet_loadouts.py tests/test_fleet_loadout_neo4j_integration.py
      - name: Run two-snapshot Neo4j contract
        run: pytest -q tests/test_fleet_loadout_neo4j_integration.py
