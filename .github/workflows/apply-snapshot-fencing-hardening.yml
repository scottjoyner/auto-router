name: Apply snapshot fencing hardening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: snapshot-fencing-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/restore-live-fleet-discovery'
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_INTEGRATION: '1'
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply snapshot fencing patch
        run: python scripts/apply_snapshot_fencing_hardening.py

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Format, lint, and compile
        run: |
          ruff format scripts/build_fleet_loadouts.py tests/test_fleet_loadout_neo4j_integration.py
          ruff check --ignore E402,E501,UP017 scripts/build_fleet_loadouts.py tests/test_fleet_loadout_neo4j_integration.py
          python -m py_compile scripts/build_fleet_loadouts.py tests/test_fleet_loadout_neo4j_integration.py

      - name: Run focused unit contracts
        run: pytest -q tests/test_fleet_loadout_authority.py tests/test_fleet_live_discovery.py

      - name: Run concurrent Neo4j fencing contract
        run: pytest -q tests/test_fleet_loadout_neo4j_integration.py

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit validated snapshot fencing
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git rm -f scripts/apply_snapshot_fencing_hardening.py
          git rm -f .github/workflows/apply-snapshot-fencing-hardening.yml
          git add scripts/build_fleet_loadouts.py tests/test_fleet_loadout_neo4j_integration.py README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: fence concurrent fleet snapshot publication'
          git push origin "HEAD:${BRANCH}"
