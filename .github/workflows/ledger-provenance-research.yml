name: Router ledger token provenance (research-only)

on:
  push:
    branches:
      - fix/ledger-provider-provenance-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile changed source
        run: python -m py_compile src/auto_router/ledger.py src/auto_router/main.py
      - name: Strict lint new migration tests
        run: ruff check tests/test_ledger_usage_provenance.py
      - name: Existing migration and integration compatibility lint
        run: |
          ruff check --ignore I001,E501,UP012,UP018,E402,F401,UP031 \
            src/auto_router/ledger.py \
            src/auto_router/main.py \
            tests/test_ledger.py
      - name: Focused ledger, accounting, routing and admission regressions
        run: |
          python -m pytest -q \
            tests/test_ledger_usage_provenance.py \
            tests/test_ledger.py \
            tests/test_provider_usage_accounting.py \
            tests/test_runtime_telemetry.py \
            tests/test_route_events.py \
            tests/test_route_event_patch.py \
            tests/test_stream_lifecycle.py \
            tests/test_runtime_projection.py \
            tests/test_runtime_projection_v2.py \
            tests/test_ops_dashboard_routes.py \
            tests/test_executor_auth.py
