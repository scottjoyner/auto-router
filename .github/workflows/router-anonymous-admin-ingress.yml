name: Router anonymous admin ingress gate (offline)

on:
  pull_request:
    branches:
      - main
      - research/router-integrated-security-review-20261105
    paths:
      - tools/router_admin_ingress_audit.py
      - tests/test_router_admin_ingress_audit.py
      - .github/workflows/router-anonymous-admin-ingress.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-network-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned unit-test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Compile source syntax without importing live Router services
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in ("tools/router_admin_ingress_audit.py", "tests/test_router_admin_ingress_audit.py"):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          PY
      - name: Run 16 offline synthetic regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m pytest -q -p no:cacheprovider tests/test_router_admin_ingress_audit.py
