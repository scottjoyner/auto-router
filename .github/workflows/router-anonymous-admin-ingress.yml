name: Router anonymous admin ingress gate (offline)

on:
  pull_request:
    branches:
      - main
      - research/router-integrated-security-review-20261105
    paths:
      - tools/router_admin_ingress_audit.py
      - tests/test_router_admin_ingress_audit.py
      - tests/test_mounted_admin_get_http_denial.py
      - tests/test_admin_mounted_runtime_contract.py
      - tests/test_admin_provider_secure_live_entrypoint.py
      - tests/test_admin_provider_response_redaction.py
      - tests/test_admin_credential_scope_collision.py
      - tests/test_router_candidate_release_config.py
      - scripts/audit_router_release_configuration.py

      - src/auto_router/main.py
      - src/auto_router/secure_live.py
      - src/auto_router/security.py
      - docker-compose.yml
      - Dockerfile
      - .github/workflows/router-anonymous-admin-ingress.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-network-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Router and test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5
      - name: Compile source syntax without importing live Router services
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in ("tools/router_admin_ingress_audit.py", "tests/test_router_admin_ingress_audit.py", "tests/test_mounted_admin_get_http_denial.py"):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          PY
      - name: Run ingress, mounted admin, and positive redaction contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_router_admin_ingress_audit.py \
            tests/test_mounted_admin_get_http_denial.py \
            tests/test_admin_mounted_runtime_contract.py \
            tests/test_admin_provider_secure_live_entrypoint.py \
            tests/test_admin_provider_response_redaction.py \
            tests/test_admin_credential_scope_collision.py \
            tests/test_router_candidate_release_config.py
