name: X1 offline host recovery evidence (synthetic, HOLD)

on:
  pull_request:
    paths:
      - ".github/workflows/x1-offhost-recovery-readonly.yml"
      - "scripts/x1_package_recovery_readonly.py"
      - "scripts/assess_x1_offline_recovery_gate.py"
      - "scripts/verify_x1_offline_*.py"
      - "scripts/verify_x1_recovery_witness.py"
      - "scripts/inspect_x1_offline_boot_structure.py"
      - "tests/test_x1_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-only-recovery-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate source without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture-only test dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Compile source-only recovery validators
        run: |
          python -m compileall -q \
            scripts/x1_package_recovery_readonly.py \
            scripts/assess_x1_offline_recovery_gate.py \
            scripts/verify_x1_offline_recovery_images.py \
            scripts/verify_x1_recovery_witness.py \
            scripts/verify_x1_offline_gpt_mirror.py \
            scripts/verify_x1_offline_recovery_bundle_v2.py \
            scripts/inspect_x1_offline_boot_structure.py
      - name: Execute synthetic negative and positive controls
        run: |
          python -m pytest -q \
            tests/test_x1_package_recovery_readonly.py \
            tests/test_x1_offline_recovery_images.py \
            tests/test_x1_recovery_witness.py \
            tests/test_x1_offline_boot_structure.py \
            tests/test_x1_offline_gpt_mirror.py \
            tests/test_x1_offline_recovery_gate.py \
            tests/test_x1_offline_recovery_bundle_v2.py
      - name: Assert workflow never authorizes live maintenance
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/x1_package_recovery_readonly.py").read_text()
          gate = Path("scripts/assess_x1_offline_recovery_gate.py").read_text()
          signed = Path("scripts/verify_x1_offline_recovery_bundle_v2.py").read_text()
          for name, text in (("package", source), ("aggregate", gate), ("signed", signed)):
              assert '"HOLD"' in text, name
              assert "return 2" in text, name
          print("HOLD-only source markers found; no host, media, secrets or devices accessed")
          PY
