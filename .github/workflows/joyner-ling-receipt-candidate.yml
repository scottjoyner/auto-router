name: joyner-ling-receipt-candidate

on:
  pull_request:
    paths:
      - src/auto_router/joyner_ling_receipt_candidate.py
      - tests/test_joyner_ling_receipt_candidate.py
      - .github/workflows/joyner-ling-receipt-candidate.yml
  push:
    branches: [main]
    paths:
      - src/auto_router/joyner_ling_receipt_candidate.py
      - tests/test_joyner_ling_receipt_candidate.py
      - .github/workflows/joyner-ling-receipt-candidate.yml

permissions:
  contents: read

jobs:
  offline-identity-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test prerequisites only
        run: python -m pip install 'pytest>=8.3' 'cryptography>=43,<46'
      - name: Verify signature, model and body binding; durable replay denial
        run: |
          python -m py_compile src/auto_router/joyner_ling_receipt_candidate.py
          python -m pytest -o addopts= tests/test_joyner_ling_receipt_candidate.py -q
