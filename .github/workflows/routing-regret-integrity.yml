name: Routing regret truthfulness
on:
  pull_request:
    branches:
      - main
      - feat/local-backlog-fleet-utilization-20261101
      - fix/routing-regret-success-only-20261102
    paths:
      - src/auto_router/ledger.py
      - tests/test_ledger.py
      - .github/workflows/routing-regret-integrity.yml
  push:
    branches:
      - fix/regret-transport-vs-work-evidence-20261103
    paths:
      - src/auto_router/ledger.py
      - tests/test_ledger.py
      - .github/workflows/routing-regret-integrity.yml
  workflow_dispatch:

jobs:
  ledger-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project tests
        run: python -m pip install -e '.[dev]'
      - name: Verify exact source compiles and obeys blocking lint
        run: |
          python -m py_compile src/auto_router/ledger.py tests/test_ledger.py
          ruff check --ignore I001,E501,UP012,UP018 src/auto_router/ledger.py tests/test_ledger.py
      - name: Prove successful transport is not signed accepted work
        run: |
          pytest -q tests/test_ledger.py tests/test_runtime_telemetry.py tests/test_benchmark_routing_policy.py tests/test_fleet_health.py
