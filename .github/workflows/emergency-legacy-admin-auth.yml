name: Emergency Legacy Admin Auth (Draft)

# Isolated code-only proof for the minimum emergency fix. It does not deploy,
# rotate credentials, inspect Tailnet peers or authorize operator cutover.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/auto_router/main.py"
      - "tests/test_legacy_admin_emergency_auth.py"
      - "tests/test_private_compose_candidate_readonly.py"
      - "tests/test_admin_ui_link_safety.py"
      - "src/auto_router/ui_pages.py"
      - "src/auto_router/templates/**"
      - "scripts/verify_private_compose_candidate_readonly.py"
      - ".github/workflows/emergency-legacy-admin-auth.yml"
  push:
    branches: [security/legacy-admin-auth-emergency-20261011]

permissions:
  contents: read

jobs:
  isolated-legacy-admin-negative-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTO_ROUTER_STRICT_OFFLINE: "true"
      AUTO_ROUTER_ADMIN_TOKEN: "synthetic-emergency-ci-only"
      AUTO_ROUTER_AUTOLOAD_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from exact checked-out source
        run: python -m pip install -e '.[dev]'
      - name: Compile minimal fix and negative tests
        run: python -m py_compile src/auto_router/main.py tests/test_legacy_admin_emergency_auth.py scripts/verify_private_compose_candidate_readonly.py tests/test_private_compose_candidate_readonly.py
      - name: All legacy GET/POST denial and no-side-effect regressions
        run: python -m pytest -q --noconftest tests/test_legacy_admin_emergency_auth.py tests/test_private_compose_candidate_readonly.py tests/test_admin_ui_link_safety.py
