name: Router admin credential isolation (synthetic)

on:
  pull_request:
    branches: [main]
    paths:
      - src/auto_router/security.py
      - tests/test_admin_ambiguous_credentials.py
      - tests/test_admin_credential_scope_collision.py
      - .github/workflows/router-admin-credential-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-credential-negative-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate without saved credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python source and test runner
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5
      - name: Synthetic no-network admin auth tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_admin_ambiguous_credentials.py \
            tests/test_admin_credential_scope_collision.py
