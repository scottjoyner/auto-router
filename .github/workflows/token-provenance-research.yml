name: Router token provenance (research-only)

on:
  push:
    branches:
      - fix/provider-recorded-usage-current-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate changed modules compile
        run: |
          python -m py_compile \
            src/auto_router/main.py \
            src/auto_router/route_events.py \
            src/auto_router/usage_accounting.py
      - name: Strict lint for new accounting code and tests
        run: |
          ruff check \
            src/auto_router/usage_accounting.py \
            tests/test_provider_usage_accounting.py
      - name: Check modified route integrations (exclude existing legacy style findings)
        run: |
          ruff check --ignore I001,E501,UP012,UP018,E402,F401,UP031 \
            src/auto_router/main.py \
            src/auto_router/route_events.py
      - name: Focused ledger, events, streaming and admission regression tests
        run: |
          python -m pytest -q \
            tests/test_provider_usage_accounting.py \
            tests/test_runtime_telemetry.py \
            tests/test_route_events.py \
            tests/test_route_event_patch.py \
            tests/test_ledger.py \
            tests/test_stream_lifecycle.py \
            tests/test_runtime_projection.py \
            tests/test_runtime_projection_v2.py \
            tests/test_ops_dashboard_routes.py \
            tests/test_executor_auth.py
