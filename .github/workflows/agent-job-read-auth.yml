name: Agent Job Read Authorization (Draft, No Production)

on:
  pull_request:
    paths:
      - "src/auto_router/main.py"
      - "tests/test_agent_job_read_auth.py"
      - ".github/workflows/agent-job-read-auth.yml"
  push:
    paths:
      - "src/auto_router/main.py"
      - "tests/test_agent_job_read_auth.py"
      - ".github/workflows/agent-job-read-auth.yml"

permissions:
  contents: read

jobs:
  fail-closed-record-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install router test dependencies on disposable runner
        run: python -m pip install -e '.[dev]'
      - name: Compile protected job handlers
        run: python -m py_compile src/auto_router/main.py tests/test_agent_job_read_auth.py
      - name: Verify unauthorized GET is refused before job lookup
        run: |
          python -m pytest -q \
            tests/test_agent_job_read_auth.py \
            tests/test_effective_provider_security.py
      - name: Show boundary of evidence
        run: |
          echo 'source_unit_contract_only=true'
          echo 'production_read_or_deploy_performed=false'
