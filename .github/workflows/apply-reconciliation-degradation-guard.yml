name: Apply reconciliation degradation guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: reconciliation-degradation-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/restore-live-fleet-discovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align formatted patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_reconciliation_degradation_guard.py')
          text = path.read_text(encoding='utf-8')
          old = "the current topology.\n'''"
          new = "the current topology. Snapshot\n'''"
          if text.count(old) != 2:
              raise SystemExit(f'expected two formatted anchors, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply degradation guard patch
        run: python scripts/apply_reconciliation_degradation_guard.py

      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Format, lint, and compile
        run: |
          ruff format scripts/build_fleet_loadouts.py
          ruff check scripts/build_fleet_loadouts.py --ignore E402,E501,UP017
          python -m compileall -q scripts/build_fleet_loadouts.py

      - name: Run focused tests
        run: |
          pytest -q tests/test_fleet_loadout_authority.py tests/test_fleet_live_discovery.py

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit validated guard
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git rm -f scripts/apply_reconciliation_degradation_guard.py
          git rm -f .github/workflows/apply-reconciliation-degradation-guard.yml
          git add scripts/build_fleet_loadouts.py README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: serialize and guard fleet reconciliation'
          git push origin "HEAD:${BRANCH}"
