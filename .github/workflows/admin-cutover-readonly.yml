name: Admin Cutover Read-Only Contract

on:
  pull_request:
    paths:
      - "scripts/verify_admin_cutover_readonly.py"
      - "scripts/verify_remote_admin_auth_readonly.py"
      - "scripts/verify_release_image_identity_readonly.py"
      - "scripts/verify_private_compose_candidate_readonly.py"
      - "scripts/verify_router_ingress_containment_readonly.py"
      - "tests/test_admin_cutover_readonly.py"
      - "tests/test_remote_admin_auth_readonly.py"
      - "tests/test_release_image_identity_readonly.py"
      - "tests/test_private_compose_candidate_readonly.py"
      - "tests/test_router_ingress_containment_readonly.py"
      - ".github/workflows/admin-cutover-readonly.yml"
  push:
    paths:
      - "scripts/verify_admin_cutover_readonly.py"
      - "scripts/verify_remote_admin_auth_readonly.py"
      - "scripts/verify_release_image_identity_readonly.py"
      - "scripts/verify_private_compose_candidate_readonly.py"
      - "scripts/verify_router_ingress_containment_readonly.py"
      - "tests/test_admin_cutover_readonly.py"
      - "tests/test_remote_admin_auth_readonly.py"
      - "tests/test_release_image_identity_readonly.py"
      - "tests/test_private_compose_candidate_readonly.py"
      - "tests/test_router_ingress_containment_readonly.py"
      - ".github/workflows/admin-cutover-readonly.yml"

permissions:
  contents: read

jobs:
  fail-closed-client-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable standalone test runner
        run: python -m pip install "pytest>=8,<10" "PyYAML>=6,<7"
      - name: Compile read-only security probes
        run: |
          python -m py_compile scripts/verify_admin_cutover_readonly.py \
            scripts/verify_remote_admin_auth_readonly.py \
            scripts/verify_release_image_identity_readonly.py \
            scripts/verify_private_compose_candidate_readonly.py \
            scripts/verify_router_ingress_containment_readonly.py
      - name: Test auth, remote denial, and immutable-image readiness without production access
        run: |
          python -m pytest -q --noconftest \
            tests/test_admin_cutover_readonly.py \
            tests/test_remote_admin_auth_readonly.py \
            tests/test_release_image_identity_readonly.py \
            tests/test_private_compose_candidate_readonly.py \
            tests/test_router_ingress_containment_readonly.py
