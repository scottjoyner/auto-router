name: P0 native task dual-signature join

on:
  pull_request:
    paths:
      - "src/auto_router/native_task_receipt_join.py"
      - "tests/test_p0_37_native_task_receipt_join.py"
      - ".github/workflows/p0-native-task-join.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-signer-correlation:
    name: Distinct signing keys and immutable native task join
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated router and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint and compile correlation
        run: |
          ruff check src/auto_router/native_task_receipt_join.py tests/test_p0_37_native_task_receipt_join.py
          python -m py_compile src/auto_router/native_task_receipt_join.py
      - name: Reject task, actor, model and signer substitution
        run: python -m pytest -q --disable-warnings tests/test_p0_37_native_task_receipt_join.py
