name: Capture mounted reconciliation failure

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'agent/restore-live-fleet-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Capture first failure
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/test_reconciliation.sh -x -vv --tb=long 2>&1 | tee mounted-reconciliation-failure.txt
      - name: Commit diagnostic only on failure
        if: steps.pytest.outcome == 'failure'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git add mounted-reconciliation-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: capture mounted reconciliation failure'
          git push origin "HEAD:${BRANCH}"
      - name: Fail when suite failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
