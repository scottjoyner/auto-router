name: P0 read-only Linux listener identity gate

on:
  pull_request:
    paths:
      - "scripts/p0_37_linux_listener_preflight.py"
      - "tests/test_p0_37_linux_listener_preflight.py"
      - ".github/workflows/p0-linux-listener-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-procfs-fixtures:
    name: Linux socket/process identity adversarial fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight fixture dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8.3,<10' 'ruff>=0.6'
      - name: Lint and compile offline preflight
        run: |
          ruff check scripts/p0_37_linux_listener_preflight.py tests/test_p0_37_linux_listener_preflight.py
          python -m py_compile scripts/p0_37_linux_listener_preflight.py
      - name: Verify no-network default and fail-closed Linux procfs semantics
        run: |
          python -m pytest --noconftest -q --disable-warnings tests/test_p0_37_linux_listener_preflight.py
