name: Private Compose Bounded Preflight (Research HOLD)
on:
  pull_request:
    paths:
      - scripts/verify_private_compose_candidate_readonly.py
      - tests/test_private_compose_candidate_readonly.py
      - tests/test_private_compose_bounded_cli.py
      - .github/workflows/private-compose-bounded-preflight-research.yml
  push:
    branches:
      - security/private-compose-bounded-preflight-20261103
    paths:
      - scripts/verify_private_compose_candidate_readonly.py
      - tests/test_private_compose_candidate_readonly.py
      - tests/test_private_compose_bounded_cli.py
      - .github/workflows/private-compose-bounded-preflight-research.yml

permissions:
  contents: read

jobs:
  synthetic-only-stdout-and-secret-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-only test tools
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.9,<1'
      - name: Compile and lint exact helper and tests
        run: |
          python -m py_compile scripts/verify_private_compose_candidate_readonly.py \
            tests/test_private_compose_candidate_readonly.py \
            tests/test_private_compose_bounded_cli.py
          ruff check --select F,I scripts/verify_private_compose_candidate_readonly.py \
            tests/test_private_compose_candidate_readonly.py \
            tests/test_private_compose_bounded_cli.py
      - name: Synthetic byte limits, process deadline and private composition
        run: |
          python -m pytest --noconftest -q \
            tests/test_private_compose_candidate_readonly.py \
            tests/test_private_compose_bounded_cli.py
