name: LFM3 Research Shadow Contracts (No Deploy)

on:
  pull_request:
    paths:
      - 'research/lfm3_top5/**'
      - 'tests/test_lfm3_research_shadow.py'
      - '.github/workflows/lfm3-research-shadow-contract.yml'
  push:
    branches:
      - 'research/lfm3-top5-shadow-*'
    paths:
      - 'research/lfm3_top5/**'
      - 'tests/test_lfm3_research_shadow.py'
      - '.github/workflows/lfm3-research-shadow-contract.yml'

permissions:
  contents: read

jobs:
  synthetic-research-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone test runner (no production dependencies)
        run: python -m pip install 'pytest>=8,<10'
      - name: Validate research module imports and synthetic gates
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_lfm3_research_shadow.py
          python -m compileall -q research/lfm3_top5
