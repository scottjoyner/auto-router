      - 'scripts/lfm3_rfc3161_anchor_verify.py'
      - '.github/workflows/lfm3-research-shadow-contract.yml'

permissions:
  contents: read

jobs:
  synthetic-research-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone research test and Ed25519 verifier
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<46'
      - name: Validate research module imports and synthetic gates
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_lfm3_research_shadow.py tests/test_lfm3_live_cpu_bundle.py tests/test_lfm3_gpu_context.py tests/test_lfm3_gpu_request_correlation.py tests/test_lfm3_untrusted_route_inputs.py tests/test_lfm3_matched_qad_cpu.py tests/test_lfm3_paired_qad_cpu.py tests/test_lfm3_gpu_canary_admission.py tests/test_lfm3_gpu_request_audit.py tests/test_lfm3_layer_placement_audit.py tests/test_lfm3_deathstar_pair_audit.py tests/test_lfm3_depth_sweep_audit.py tests/test_lfm3_long_counterbalance_audit.py tests/test_lfm3_random_mixed_audit.py tests/test_lfm3_quality_task_audit.py tests/test_lfm3_quality_canonical_guard.py tests/test_lfm3_quality_adjusted_eval.py tests/test_lfm3_joyner_gpu_capacity_gate.py tests/test_lfm3_e2e_replay_comparator.py tests/test_lfm3_unstructured_triage_audit.py tests/test_lfm3_unstructured_rule_baseline.py tests/test_lfm3_prospective_holdout_gate.py tests/test_lfm3_session_stability_gate.py tests/test_lfm3_source_fact_alignment_guard.py tests/test_lfm3_independent_custody_handoff.py tests/test_lfm3_primary_capture_reconciliation.py tests/test_lfm3_rfc3161_anchor_verifier.py tests/test_lfm3_public_contract_timestamp_verify.py tests/test_lfm3_selective_agreement_shadow.py tests/test_lfm3_blind_case_intake.py tests/test_lfm3_blind_capture_reconciliation.py tests/test_lfm3_private_pair_integrity.py tests/test_lfm3_prewitness_query.py tests/test_lfm3_signer_payload_handoff.py tests/test_lfm3_structured_decode_preflight.py
          python -m compileall -q research/lfm3_top5 scripts/lfm3_private_json_reader.py scripts/lfm3_prepare_blind_packet.py scripts/lfm3_private_output_writer.py scripts/lfm3_audit_private_projection_pair.py scripts/lfm3_prepare_prewitness_tsq.py scripts/lfm3_signer_payload_handoff.py
