name: LFM3 Research Shadow Contracts (No Deploy)

on:
  pull_request:
    paths:
      - 'research/lfm3_top5/**'
      - 'tests/test_lfm3_research_shadow.py'
      - 'tests/test_lfm3_live_cpu_bundle.py'
      - 'tests/test_lfm3_gpu_context.py'
      - 'tests/test_lfm3_gpu_request_correlation.py'
      - 'tests/test_lfm3_untrusted_route_inputs.py'
      - 'tests/test_lfm3_matched_qad_cpu.py'
      - 'tests/test_lfm3_paired_qad_cpu.py'
      - 'tests/test_lfm3_gpu_canary_admission.py'
      - 'tests/test_lfm3_gpu_request_audit.py'
      - '.github/workflows/lfm3-research-shadow-contract.yml'
  push:
    branches:
      - 'research/lfm3-top5-shadow-*'
    paths:
      - 'research/lfm3_top5/**'
      - 'tests/test_lfm3_research_shadow.py'
      - 'tests/test_lfm3_live_cpu_bundle.py'
      - 'tests/test_lfm3_gpu_context.py'
      - 'tests/test_lfm3_gpu_request_correlation.py'
      - 'tests/test_lfm3_untrusted_route_inputs.py'
      - 'tests/test_lfm3_matched_qad_cpu.py'
      - 'tests/test_lfm3_paired_qad_cpu.py'
      - 'tests/test_lfm3_gpu_canary_admission.py'
      - 'tests/test_lfm3_gpu_request_audit.py'
      - '.github/workflows/lfm3-research-shadow-contract.yml'

permissions:
  contents: read

jobs:
  synthetic-research-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone research test and Ed25519 verifier
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<46'
      - name: Validate research module imports and synthetic gates
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_lfm3_research_shadow.py tests/test_lfm3_live_cpu_bundle.py tests/test_lfm3_gpu_context.py tests/test_lfm3_gpu_request_correlation.py tests/test_lfm3_untrusted_route_inputs.py tests/test_lfm3_matched_qad_cpu.py tests/test_lfm3_paired_qad_cpu.py tests/test_lfm3_gpu_canary_admission.py tests/test_lfm3_gpu_request_audit.py
          python -m compileall -q research/lfm3_top5
