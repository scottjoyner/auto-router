name: Joyner duplicate model unit port witness (offline)

on:
  pull_request:
    paths:
      - scripts/joyner_unit_port_collision.py
      - tests/test_joyner_unit_port_collision.py
      - docs/joyner-duplicate-unit-port-review-20261113.md
      - .github/workflows/joyner-unit-port-collision.yml
  push:
    branches: [main]
    paths:
      - scripts/joyner_unit_port_collision.py
      - tests/test_joyner_unit_port_collision.py
      - .github/workflows/joyner-unit-port-collision.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "verified checkout SHA $EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test runner only
        run: python -m pip install pytest
      - name: Compile and test read-only witness
        run: |
          python -m py_compile scripts/joyner_unit_port_collision.py
          python -m pytest -q -o addopts= -p no:cacheprovider tests/test_joyner_unit_port_collision.py
