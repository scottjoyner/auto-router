name: Fleet live discovery

on:
  pull_request:
    paths:
      - 'src/auto_router/fleet_task_dispatcher.py'
      - 'scripts/discover_fleet_models.py'
      - 'tests/test_fleet_live_discovery.py'
      - '.env.example'
      - '.github/workflows/fleet-live-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m py_compile src/auto_router/fleet_task_dispatcher.py scripts/discover_fleet_models.py
      - run: pytest -q tests/test_fleet_live_discovery.py
