name: Fleet live discovery

on:
  pull_request:
    paths:
      - 'src/auto_router/__init__.py'
      - 'src/auto_router/fleet_task_dispatcher.py'
      - 'src/auto_router/discovery_enabled_policy.py'
      - 'scripts/discover_fleet_models.py'
      - 'tests/test_fleet_live_discovery.py'
      - 'tests/test_disabled_provider_discovery.py'
      - 'config/providers.yaml'
      - '.env.example'
      - '.github/workflows/fleet-live-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Compile discovery paths
        run: |
          python -m py_compile \
            src/auto_router/__init__.py \
            src/auto_router/fleet_task_dispatcher.py \
            src/auto_router/discovery_enabled_policy.py \
            scripts/discover_fleet_models.py
      - name: Lint discovery paths
        run: |
          ruff check --ignore E402,E501,I001 \
            src/auto_router/__init__.py \
            src/auto_router/fleet_task_dispatcher.py \
            src/auto_router/discovery_enabled_policy.py \
            scripts/discover_fleet_models.py \
            tests/test_fleet_live_discovery.py \
            tests/test_disabled_provider_discovery.py
      - name: Test discovery failure modes
        run: |
          pytest -q \
            tests/test_fleet_live_discovery.py \
            tests/test_disabled_provider_discovery.py
