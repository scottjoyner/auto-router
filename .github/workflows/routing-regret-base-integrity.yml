name: Routing regret transport integrity
on:
  pull_request:
    branches:
      - feat/local-backlog-fleet-utilization-20261101
    paths:
      - src/auto_router/ledger.py
      - tests/test_ledger.py
      - .github/workflows/routing-regret-base-integrity.yml
  push:
    branches:
      - fix/routing-regret-success-only-20261102
    paths:
      - src/auto_router/ledger.py
      - tests/test_ledger.py
      - .github/workflows/routing-regret-base-integrity.yml
  workflow_dispatch:

jobs:
  ledger-transport-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and isolated testing dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile and lint router ledger
        run: |
          python -m py_compile src/auto_router/ledger.py tests/test_ledger.py
          ruff check --ignore I001,E501,UP012,UP018 src/auto_router/ledger.py tests/test_ledger.py
      - name: Verify failed routes do not count as completed work
        run: |
          pytest -q tests/test_ledger.py tests/test_runtime_telemetry.py tests/test_benchmark_routing_policy.py tests/test_fleet_health.py
