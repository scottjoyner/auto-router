name: Outbox pressure schedule truth
on:
  pull_request:
    branches:
      - main
      - feat/local-backlog-fleet-utilization-20261101
    paths:
      - src/auto_router/service_routes.py
      - tests/test_service_routes.py
      - .github/workflows/outbox-scheduled-drain-truth.yml
  push:
    branches:
      - fix/outbox-scheduled-drain-pressure-20261103
    paths:
      - src/auto_router/service_routes.py
      - tests/test_service_routes.py
      - .github/workflows/outbox-scheduled-drain-truth.yml
  workflow_dispatch:

jobs:
  pressure-truth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and isolated dev tools
        run: python -m pip install -e '.[dev]'
      - name: Compile and enforce correctness lint
        run: |
          python -m py_compile src/auto_router/service_routes.py tests/test_service_routes.py
          ruff check --ignore I001,E501,UP012,UP018 src/auto_router/service_routes.py tests/test_service_routes.py
      - name: Scheduled outbox, false-positive, retry, dead-letter and dashboard tests
        run: |
          pytest -q tests/test_event_outbox.py tests/test_event_dispatcher.py \
            tests/test_service_routes.py tests/test_main_health.py \
            tests/test_ops_dashboard_routes.py
