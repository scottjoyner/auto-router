name: cache-affinity-telemetry

on:
  push:
    branches: ["agent/cache-affinity-poc"]
  pull_request:
    paths:
      - "src/auto_router/cache_affinity*.py"
      - "tests/test_cache_affinity*.py"
      - "scripts/cache-affinity-telemetry-smoke.py"
      - ".github/workflows/cache-affinity-telemetry.yml"

jobs:
  telemetry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run cache-affinity contract tests
        run: |
          pytest -q \
            tests/test_cache_affinity.py \
            tests/test_cache_affinity_policy.py \
            tests/test_cache_affinity_shadow.py \
            tests/test_cache_affinity_shadow_event.py \
            tests/test_cache_affinity_route_shadow.py \
            tests/test_cache_affinity_route_event.py \
            tests/test_cache_affinity_telemetry.py \
            tests/test_cache_affinity_ttft_report.py
      - name: Generate live-shaped telemetry fixture
        env:
          PYTHONPATH: src
        run: |
          python scripts/cache-affinity-telemetry-smoke.py
          python -m json.tool cache-affinity-telemetry-smoke.json >/dev/null
      - name: Validate fixture cannot be mistaken for promotion evidence
        run: |
          python - <<'PY'
          import json
          p = json.load(open('cache-affinity-telemetry-smoke.json'))
          assert p['synthetic_live_shaped_fixture'] is True
          assert p['promotion_evidence'] is False
          assert p['authoritative_behavior_changed'] is False
          assert p['routing_safety_regressions'] == 0
          print({k: p[k] for k in ('observations','median_ttft_reduction_ratio','routing_safety_regressions')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cache-affinity-telemetry-smoke
          path: cache-affinity-telemetry-smoke.json
          if-no-files-found: error
          retention-days: 30
