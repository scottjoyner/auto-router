name: Von routing policy-value reconciliation

on:
  push:
    branches:
      - experiment/von-policy-value-reconciliation-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verified-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only offline lint tooling
        run: python -m pip install 'ruff>=0.6,<1'
      - name: Verify all shadow, CPU pilot and policy source tests
        run: |
          python -m unittest discover -s tests -p 'test_*shadow.py' -q
          python -m unittest discover -s tests -p 'test_synthetic_decision_challenge.py' -q
          python -m unittest discover -s tests -p 'test_von_cpu_pilot.py' -q
          python -m unittest discover -s tests -p 'test_von_matched_wording.py' -q
          python -m unittest discover -s tests -p 'test_von_abstention_ablation.py' -q
          python -m unittest discover -s tests -p 'test_von_policy_value_reconcile.py' -q
      - name: Strict lint — no model imports
        run: |
          ruff check \
            experiments/typed_decision_shadow.py \
            experiments/von_choice_shadow.py \
            experiments/build_synthetic_decision_challenge.py \
            experiments/von_cpu_pilot.py \
            experiments/von_cpu_controls.py \
            experiments/von_matched_wording.py \
            experiments/von_abstention_ablation.py \
            experiments/von_policy_value_reconcile.py \
            tests/test_typed_decision_shadow.py \
            tests/test_von_choice_shadow.py \
            tests/test_synthetic_decision_challenge.py \
            tests/test_von_cpu_pilot.py \
            tests/test_von_matched_wording.py \
            tests/test_von_abstention_ablation.py \
            tests/test_von_policy_value_reconcile.py
      - name: Verify sanitized pinned baseline artifact
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          p = Path("experiments/evidence/von-policy-baseline-20261011.json")
          blob = p.read_bytes()
          expected = "79ba92b8474e96d02275e8d34e43531c8a17ab0598a5f586d083035670a490fa"
          assert sha256(blob).hexdigest() == expected
          assert len(blob) == 5931
          report = json.loads(blob)
          assert report["source_observation_count"] == 100
          assert report["unique_fictional_situations_total"] == 10
          assert report["real_fleet_case_count"] == 0
          assert report["hardware_execution_attested"] is False
          assert report["production_approval"] is False
          assert all(x["multi_eligible_variants"] == 0 for x in (
              *report["by_condition"].values(), *report["by_template"].values()))
          print("Pinned metadata-only evidence verified, no model inference attempted.")
          PY
