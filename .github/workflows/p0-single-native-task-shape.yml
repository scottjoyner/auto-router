name: P0 strict single native task shape

on:
  pull_request:
    paths:
      - "src/auto_router/p0_single_task_shape.py"
      - "tests/test_p0_37_single_task_shape.py"
      - ".github/workflows/p0-single-native-task-shape.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-single-task:
    name: Signed v2 actor cannot admit native batch or tool fanout
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated router and fixture dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint narrow gate
        run: |
          ruff check src/auto_router/p0_single_task_shape.py tests/test_p0_37_single_task_shape.py
          python -m py_compile src/auto_router/p0_single_task_shape.py
      - name: Verify real signed ASGI cannot bypass fanout restrictions
        run: |
          python -m pytest -q --disable-warnings tests/test_p0_37_single_task_shape.py
